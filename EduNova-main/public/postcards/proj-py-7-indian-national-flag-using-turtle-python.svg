<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18120b" />
      <stop offset="60%" stop-color="#07160d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <radialGradient id="mesh-glow" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="rose-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="480" fill="url(#bg-grad)" />
  <rect width="800" height="480" fill="url(#mesh-glow)" />
  <rect width="800" height="480" fill="url(#dot-grid)" />

  <!-- Outer Card Frame Border -->
  <rect x="12" y="12" width="776" height="456" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
  <rect x="24" y="24" width="752" height="432" rx="14" fill="none" stroke="#16a34a" stroke-opacity="0.2" stroke-width="1" />

  <!-- Top Header Badges -->
  <g transform="translate(48, 48)">
    <!-- Tech Badge Pill -->
    <rect width="160" height="32" rx="8" fill="#18181b" stroke="#16a34a" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="80" y="21" fill="#16a34a" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">TURTLE GEOMETRY</text>

    <!-- Category Pill -->
    <rect x="175" y="0" width="180" height="32" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <text x="265" y="21" fill="#e4e4e7" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">NATIONAL PATRIOTIC ART</text>
  </g>

  <!-- Domain Specific Centerpiece Graphic -->
  
        <!-- Indian Flag & Ashoka Chakra -->
        <g transform="translate(480, 120)">
          <!-- Saffron, White, Green Bands -->
          <rect x="0" y="0" width="260" height="60" rx="6" fill="#f97316" />
          <rect x="0" y="60" width="260" height="60" fill="#f8fafc" />
          <rect x="0" y="120" width="260" height="60" rx="6" fill="#16a34a" />
          <!-- Ashoka Chakra (24 Spokes) -->
          <circle cx="130" cy="90" r="24" fill="none" stroke="#1d4ed8" stroke-width="3" />
          <circle cx="130" cy="90" r="4" fill="#1d4ed8" />
          <!-- Spokes -->
          <g stroke="#1d4ed8" stroke-width="1.5">
            <line x1="130" y1="90" x2="154" y2="90" /><line x1="130" y1="90" x2="150.78460969082653" y2="102" /><line x1="130" y1="90" x2="142" y2="110.78460969082653" /><line x1="130" y1="90" x2="130" y2="114" /><line x1="130" y1="90" x2="118" y2="110.78460969082653" /><line x1="130" y1="90" x2="109.21539030917347" y2="102" /><line x1="130" y1="90" x2="106" y2="90" /><line x1="130" y1="90" x2="109.21539030917347" y2="78" /><line x1="130" y1="90" x2="117.99999999999999" y2="69.21539030917347" /><line x1="130" y1="90" x2="130" y2="66" /><line x1="130" y1="90" x2="142" y2="69.21539030917347" /><line x1="130" y1="90" x2="150.78460969082653" y2="77.99999999999999" />
          </g>
          <!-- Mast -->
          <rect x="-10" y="-10" width="10" height="240" rx="4" fill="#94a3b8" />
        </g>
      

  <!-- Left Content Area: Project Title & Details -->
  <g transform="translate(48, 140)">
    <!-- Decorative mini accent bar -->
    <rect x="0" y="0" width="36" height="4" rx="2" fill="#16a34a" />

    <!-- Project Title -->
    <text x="0" y="44" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">Indian National Flag Turtle</text>
    

    <!-- Tech Stack Summary -->
    <g transform="translate(0, 78)">
      <text x="0" y="0" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">Python • 
      Turtle Graphics • 
      Geometry</text>
    </g>

    <!-- Key Deliverables Feature Checkmarks -->
    <g transform="translate(0, 116)">
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="8" fill="#16a34a" fill-opacity="0.2" />
        <path d="M 5 8 L 7.5 10.5 L 12 5.5" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="24" y="12" fill="#d4d4d8" font-family="sans-serif" font-size="12" font-weight="600">Full Tested Source Code Included</text>
      </g>
      <g transform="translate(0, 26)">
        <circle cx="8" cy="8" r="8" fill="#16a34a" fill-opacity="0.2" />
        <path d="M 5 8 L 7.5 10.5 L 12 5.5" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="24" y="12" fill="#d4d4d8" font-family="sans-serif" font-size="12" font-weight="600">Step-by-Step Installation &amp; Run Manual</text>
      </g>
      <g transform="translate(0, 52)">
        <circle cx="8" cy="8" r="8" fill="#16a34a" fill-opacity="0.2" />
        <path d="M 5 8 L 7.5 10.5 L 12 5.5" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="24" y="12" fill="#d4d4d8" font-family="sans-serif" font-size="12" font-weight="600">Academic &amp; Commercial Project Ready</text>
      </g>
    </g>
  </g>

  <!-- Bottom Brand & Verification Footer -->
  <g transform="translate(48, 420)">
    <!-- Watermark / Seal -->
    <g transform="translate(0, 0)">
      <circle cx="10" cy="10" r="10" fill="#f59e0b" fill-opacity="0.2" />
      <polygon points="10,4 12,8 16,9 13,12 14,16 10,14 6,16 7,12 4,9 8,8" fill="#f59e0b" />
      <text x="28" y="14" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="600">EDUNOVA VERIFIED REPOSITORY</text>
    </g>

    <text x="704" y="14" fill="#71717a" font-family="monospace" font-size="11" text-anchor="end">PKG-ID: proj-py-7-indian-nationa</text>
  </g>
</svg>